name: Release from verified tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  tests:
    name: Required host, schema and Blender checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish after exact-tag CI
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify semantic version tag
        shell: bash
        env:
          VERSION_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          test -n "$COMMIT"

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check exact immutable tag and release notes
        env:
          VERSION_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(git rev-parse "refs/tags/$VERSION_TAG^{}")" = "$COMMIT"
          test -f "RELEASES/$VERSION_TAG.md"
          test -n "$(cat "RELEASES/$VERSION_TAG.md")"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION_TAG" \
            --verify-tag \
            --target "$COMMIT" \
            --title "Blender Agent Kit $VERSION_TAG" \
            --notes-file "RELEASES/$VERSION_TAG.md"
