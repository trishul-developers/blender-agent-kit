name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_call:

jobs:
  tier1-host-and-schemas:
    name: Tier 1 · Spec, Schema, PNG & Installer Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      BLENDER_AGENT_KIT_STRICT_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host test dependencies
        run: python -m pip install numpy jsonschema pillow
      - name: Run Tier 1 Validator & Host Tests
        run: python tools/run_tests.py --suite host

  tier2-tier3-headless-blender:
    name: Tier 2 & 3 · Headless Blender 5.2 LTS Tests
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.2.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Blender 5.2 LTS Linux Tarball
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender-5.2
          key: blender-linux-${{ env.BLENDER_VERSION }}
      - name: Download Blender 5.2 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender-5.2
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/blender-5.2
      - name: Run Doctor Smoke Test
        run: python tools/doctor.py --blender ~/blender-5.2/blender --device cpu --json
      - name: Run Tier 2 Core Headless bpy Tests
        run: python tools/run_tests.py --suite core --blender ~/blender-5.2/blender
      - name: Run Tier 3 Auto-Discovered Target Contract Tests
        run: python tools/run_tests.py --suite targets --blender ~/blender-5.2/blender


  tier4-independent-demo-smoke:
    name: Tier 4 · Independent demo source rebuild and round-trip smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BLENDER_VERSION: "5.2.4"
      BLENDER_AGENT_KIT_STRICT_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install procedural source dependencies
        run: python -m pip install numpy pillow scipy jsonschema
      - name: Cache Blender 5.2.4 LTS
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender-5.2.4
          key: blender-linux-${{ env.BLENDER_VERSION }}
      - name: Download Blender 5.2.4 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/blender-5.2.4
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" |
            tar -xJ --strip-components=1 -C ~/blender-5.2.4
      - name: Run canonical demo smoke entrypoints
        shell: bash
        run: |
          set -euo pipefail
          export BLENDER_EXECUTABLE="$HOME/blender-5.2.4/blender"
          S="$RUNNER_TEMP/independent/SupplyCrate"
          F="$RUNNER_TEMP/independent/SciFiKit"
          python demo/SupplyCrate/run_demo.py --mode smoke --clean \
            --out "$S" --blender "$BLENDER_EXECUTABLE" --device cpu
          python demo/SciFiKit/run_demo.py --mode smoke --clean \
            --out "$F" --blender "$BLENDER_EXECUTABLE" --device cpu

      - name: Prove batch miss then cache hit on canonical SupplyCrate
        shell: bash
        run: |
          set -euo pipefail
          export BLENDER_EXECUTABLE="$HOME/blender-5.2.4/blender"
          S="$RUNNER_TEMP/independent/SupplyCrate"
          RUN="skills/core/blender-core/scripts/run.py"
          python "$RUN" batch --operation qa --input-dir "$S/scenes" --pattern "SupplyCrate.blend" \
            --target unity --project-profile demo/SupplyCrate/source/supplycrate.profile.json \
            --asset-class solid_prop --out "$S/batch" --result-json "$S/evidence/batch_first.json"
          python "$RUN" batch --operation qa --input-dir "$S/scenes" --pattern "SupplyCrate.blend" \
            --target unity --project-profile demo/SupplyCrate/source/supplycrate.profile.json \
            --asset-class solid_prop --out "$S/batch" --result-json "$S/evidence/batch_second.json"

      - name: Assert expected source-bound evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "independent"
          # Both documented canonical smoke entrypoints were executed.
          crate = base / "SupplyCrate"
          crate_run = json.loads((crate / "evidence/run_demo.json").read_text())
          assert crate_run["status"] == "ok" and crate_run["mode"] == "smoke", crate_run
          assert [s["name"] for s in crate_run["steps"]] == [
              "generate_textures", "build_blend", "inspect", "pack", "deliver"
          ], crate_run

          batch_first = json.loads((crate / "evidence/batch_first.json").read_text())
          batch_second = json.loads((crate / "evidence/batch_second.json").read_text())
          assert batch_first["status"] == "ok" and batch_first["counts"] == {
              "discovered": 1, "processed": 1, "skipped": 0, "failed": 0
          }, batch_first
          assert batch_second["status"] == "ok" and batch_second["counts"] == {
              "discovered": 1, "processed": 0, "skipped": 1, "failed": 0
          }, batch_second
          assert batch_second["items"][0]["cache_hit"] is True
          assert batch_first["items"][0]["cache_key"] == batch_second["items"][0]["cache_key"]

          delivery = json.loads((crate / "evidence/deliver.json").read_text())
          assert delivery["status"] == "ok" and delivery["qa_gate"]["passed"], delivery
          assert [s["name"] for s in delivery["stages"]] == ["inspect", "qa", "review", "bundle"]
          assert all(s["duration_ms"] >= 0 for s in delivery["stages"])
          crate_bundle = next(s["result"] for s in delivery["stages"] if s["name"] == "bundle")
          assert len(crate_bundle["parts"]) == 4
          assert all(part["roundtrip"]["passed"] for part in crate_bundle["parts"])
          crate_review = next(s["result"] for s in delivery["stages"] if s["name"] == "review")
          assert crate_review["style"] == "technical"
          assert crate_review["render_engine"] == "CYCLES"
          for image_path in crate_review["artifacts"].values():
              if isinstance(image_path, str):
                  assert Path(image_path).is_file() and Path(image_path).stat().st_size > 1000

          sci = base / "SciFiKit"
          sci_run = json.loads((sci / "evidence/run_demo.json").read_text())
          assert sci_run["status"] == "ok" and sci_run["mode"] == "smoke", sci_run
          assert [s["name"] for s in sci_run["steps"]] == [
              "generate_textures", "build_bulkhead", "inspect",
              "pack_trim", "pack_emissive", "deliver"
          ], sci_run
          sci_delivery = json.loads((sci / "evidence/deliver.json").read_text())
          assert sci_delivery["status"] == "ok" and sci_delivery["qa_gate"]["passed"], sci_delivery
          sci_bundle = next(s["result"] for s in sci_delivery["stages"] if s["name"] == "bundle")
          assert len(sci_bundle["parts"]) == 6
          assert all(part["roundtrip"]["passed"] for part in sci_bundle["parts"])

          emissive = json.loads((sci / "evidence/pack_emissive.json").read_text())
          assert "_EmissionMap" in {t["slot"] for t in emissive["artifacts"]["textures"]}
          print("PASS: canonical demo entrypoints + batch cache + verified delivery smoke")
          PY
