name: Publish v0.2.1 after exact-main CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified patch
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact passing main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Confirm this is the release-notes merge commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$VERIFIED_SHA" || {
            echo "::error::main moved after CI; refusing release"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test -f RELEASES/v0.2.1.md
          if ! git diff --name-only HEAD^ HEAD | grep -qx 'RELEASES/v0.2.1.md'; then
            echo "This is not the v0.2.1 release-notes commit; no release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.1" >/dev/null 2>&1; then
            echo "::error::v0.2.1 already exists; refusing to retarget"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create signed-off version tag and GitHub release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v0.2.1 \
            --target "$VERIFIED_SHA" \
            --title "Blender Agent Kit v0.2.1" \
            --notes-file RELEASES/v0.2.1.md \
            --verify-tag=false
